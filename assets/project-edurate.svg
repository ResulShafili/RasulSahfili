<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
<title id="title">EduRate</title>
<desc id="desc">EduRate: Education review platform with a leaderboard and an admin moderation panel, in Azerbaijani, English and Russian. Built with Next.js, i18n AZ · EN · RU, Vercel. Live at edu-rate-nu.vercel.app.</desc>
<style>
.sans{font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif}
.mono{font-family:ui-monospace, 'SFMono-Regular', 'Cascadia Mono', Consolas, 'Liberation Mono', Menlo, monospace}
.p-beam{stroke-dashoffset:0;animation:p-run 10s linear infinite}
  @keyframes p-run{to{stroke-dashoffset:-2954.2}}
      .m-bar{transform-box:fill-box;transform-origin:0 50%;animation:m-bar 5s cubic-bezier(.3,.9,.3,1) infinite}
      @keyframes m-bar{0%{transform:scaleX(.08)}30%,85%{transform:scaleX(1)}100%{transform:scaleX(.08)}}
      .m-star{transform-box:fill-box;transform-origin:center;animation:m-star 5s ease-out infinite}
      @keyframes m-star{0%{opacity:0;transform:scale(.3)}12%,85%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(.3)}}
  .p-in{animation:p-in .6s ease-out both}
  @keyframes p-in{from{opacity:0;transform:translateY(10px)}}
  .p-live{transform-box:fill-box;transform-origin:center;animation:p-live 1.6s ease-out infinite}
  @keyframes p-live{from{transform:scale(1);opacity:.8}to{transform:scale(3);opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<defs>
