        <rect x="94" y="185" width="206" height="18" rx="9" fill="#131c33"/>
        <rect class="m-bar" x="94" y="185" width="114" height="18" rx="9" fill="url(#m-bar)" style="animation-delay:0.5s"/><circle cx="70" cy="228" r="12" fill="#131c33" stroke="#1f2a44"/>
        <text class="mono" x="70" y="233" text-anchor="middle" font-size="13" font-weight="700" fill="#94a3b8">5</text>
        <rect x="94" y="219" width="206" height="18" rx="9" fill="#131c33"/>
        <rect class="m-bar" x="94" y="219" width="88" height="18" rx="9" fill="url(#m-bar)" style="animation-delay:0.7s"/></g>
  <text class="mono p-in" x="404" y="66" font-size="13" font-weight="700" letter-spacing="3" fill="#a78bfa">02 · REVIEW PLATFORM</text>
  <text class="sans p-in" x="404" y="120" font-size="46" font-weight="800" fill="url(#p-name)" style="animation-delay:.1s">EduRate</text>
