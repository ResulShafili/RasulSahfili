  <radialGradient id="p-glowA" cx="0" cy="0" r="1">
    <stop offset="0" stop-color="#a78bfa" stop-opacity=".18"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="p-glowB" cx="1" cy="1" r="1">
    <stop offset="0" stop-color="#22d3ee" stop-opacity=".14"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
  </radialGradient>
  <pattern id="p-dots" width="24" height="24" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity=".05"/>
  </pattern>
  <linearGradient id="p-beamA" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1200" y2="300">
    <stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#22d3ee"/>
  </linearGradient>
  <clipPath id="p-clip"><path d="M23,1 H1177 A22,22 0 0 1 1199,23 V277 A22,22 0 0 1 1177,299 H23 A22,22 0 0 1 1,277 V23 A22,22 0 0 1 23,1 Z"/></clipPath><linearGradient id="m-bar" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
  <linearGradient id="p-name" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="520" y2="0" spreadMethod="repeat">
    <stop offset="0" stop-color="#e6edf7"/><stop offset=".4" stop-color="#e6edf7"/><stop offset=".5" stop-color="#22d3ee"/><stop offset=".6" stop-color="#e6edf7"/><stop offset="1" stop-color="#e6edf7"/>
    <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="520 0" dur="5s" repeatCount="indefinite"/>
  </linearGradient>
  <radialGradient id="p-art" cx=".5" cy=".5" r=".7"><stop offset="0" stop-color="#a78bfa" stop-opacity=".16"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></radialGradient>
