<title id="title">About me</title>
<desc id="desc">Rasul Shafili — Computer Engineering student at Karabakh University. AI training: evaluating and ranking model responses on image and video; Data: cleaning and structuring data, analysis with SQL and Python; Web: full-stack apps with React, Node.js, Express and PostgreSQL. Azerbaijani · Turkish · English. building data projects</desc>
