name: Refresh profile cards

on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Build the hand-designed cards
        run: node scripts/build-static.mjs

      - name: Build the live stats card
        run: node scripts/build-stats.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/generated/snake.svg?color_snake=#22d3ee&color_dots=#8b949e26,#0e4d64,#0e7490,#06b6d4,#67e8f9

      # Pushes made with GITHUB_TOKEN do not start new workflow runs, so this cannot loop.
      - name: Commit the refreshed cards
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets
          if git diff --cached --quiet; then echo 'Nothing changed'; exit 0; fi
          git commit -m 'Refresh profile cards'
          git push
